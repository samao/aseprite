name: build-auto
on:
  push:
    paths:
    - '.github/workflows/build-auto.yml'
    - 'build.cmd'
    - 'build.ps1'
    - 'build.sh'
    - 'laf'
jobs:
  build-auto:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 31
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        build_type: [RelWithDebInfo, Debug]
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
    - name: Install Dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          libpixman-1-dev libfreetype6-dev libharfbuzz-dev zlib1g-dev \
          libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev \
          libfontconfig1-dev
    - uses: aseprite/get-ninja@main
    - uses: TheMrMilchmann/setup-msvc-dev@v4
      if: runner.os == 'Windows'
      with:
        arch: x64
    - name: Building
      shell: bash
      run: |
        bash build.sh --auto --norun
    - name: Running CLI Tests
      shell: bash
      run: |
        if [[ "${{ runner.os }}" == "Linux" ]] ; then
          export XVFB=xvfb-run
        fi
        export ASEPRITE=$PWD/build/bin/aseprite
        cd tests
        $XVFB bash run-tests.sh
    - name: Bundle OpenSSL DLLs (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        curl -L -o openssl.zip https://download.firedaemon.com/FireDaemon-OpenSSL/openssl-3.0.0.zip
        unzip -o openssl.zip -d openssl-temp
        find openssl-temp -name "libcrypto-3-x64.dll" -exec cp {} build/bin/ \;
        find openssl-temp -name "libssl-3-x64.dll" -exec cp {} build/bin/ \;
        ls -la build/bin/
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: aseprite-${{ matrix.os }}-${{ matrix.build_type }}
        path: build/bin
